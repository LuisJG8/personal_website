<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1117">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Font with display swap for performance -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  
  <!-- Page metadata -->
</head>
<body class="flex flex-col">
  <!-- Navigation -->
  <header id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300">
    <nav class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-center h-16">
        <!-- Desktop Navigation -->
        <div class="hidden md:flex items-center gap-8">
          <a href="/" class="nav-link">Home</a>
          <a href="/experience/" class="nav-link">Experience</a>
          <a href="/talks/" class="nav-link">Speaking &amp; Events</a>
          <a href="/projects/" class="nav-link">Projects</a>
          
          <!-- Theme Toggle -->
          <button id="theme-toggle" class="text-gray-400 hover:text-white dark:text-gray-400 dark:hover:text-white light:text-gray-600 light:hover:text-gray-900 transition-colors" aria-label="Toggle theme">
            <!-- Moon icon (shown in dark mode, click to switch to light) -->
            <svg id="theme-icon-moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
            <!-- Sun icon (shown in light mode, click to switch to dark) -->
            <svg id="theme-icon-sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
          </button>
        </div>
        
        <!-- Mobile menu button -->
        <button id="mobile-menu-button" class="md:hidden text-gray-400 hover:text-white" aria-expanded="false" aria-controls="mobile-menu" aria-label="Toggle menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
      
      <!-- Mobile Navigation -->
      <div id="mobile-menu" class="hidden md:hidden pb-4">
        <div class="flex flex-col gap-2">
          <a href="/" class="nav-link py-2">Home</a>
          <a href="/experience/" class="nav-link py-2">Experience</a>
          <a href="/talks/" class="nav-link py-2">Speaking &amp; Events</a>
          <a href="/projects/" class="nav-link py-2">Projects</a>
        </div>
      </div>
    </nav>
  </header>

  <main class="w-full max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-24 pb-16">
    <!-- Page content -->
  </main>

  <hr class="footer-divider mb-6 mt-auto border-dark-700" aria-hidden="true">

  <script type="module" src="/src/main.js"></script>
</body>
</html>
