<svg width="960" height="480" viewBox="0 0 960 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub ETL project thumbnail</title>
  <desc id="desc">A simple GitHub ETL graphic with a GitHub mark, ETL text, and extract transform load flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="215" y1="146" x2="746" y2="334" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10V2Z" fill="#22D3EE"/>
    </marker>
  </defs>

  <rect width="960" height="480" rx="42" fill="url(#bg)"/>
  <rect x="1" y="1" width="958" height="478" rx="41" stroke="#334155" stroke-opacity=".6" stroke-width="2"/>

  <circle cx="270" cy="240" r="94" fill="#0B1220" stroke="#334155" stroke-width="2"/>
  <circle cx="270" cy="240" r="78" fill="#111827" stroke="#22D3EE" stroke-opacity=".45" stroke-width="2"/>
